[project]
name = "crm-ventas-alphasoft"
version = "0.1.0"
description = "Agente CRM de prospección para Alphasoft — Argentina (Docker + Groq + Scrapling)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.119",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9.10,<3",
    "pgvector>=0.3.6,<0.4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "Jinja2>=3.1,<4",
    "httpx>=0.27,<0.28",
    "groq>=0.13,<0.14",
    "APScheduler>=3.10,<4",
    "tenacity>=9.0,<10",
    "scrapling[all]>=0.4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.3,<4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7,<0.8",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
