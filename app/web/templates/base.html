<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}CRM Ventas Alphasoft{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .toast { position: fixed; bottom: 1rem; right: 1rem; z-index: 50; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xl font-semibold tracking-tight">CRM Alphasoft</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500">v0.1</span>
      </div>
      <nav class="flex items-center gap-4 text-sm text-slate-600">
        <a class="hover:text-slate-900" href="/">Leads</a>
        <a class="hover:text-slate-900" href="/stats">Dashboard</a>
        <a class="hover:text-slate-900" href="/docs">API</a>
        <a class="hover:text-slate-900" href="/health">Health</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-area" class="toast"></div>
</body>
</html>
